name: Regenerate OGP

on:
  workflow_dispatch:
    inputs:
      deck:
        description: "生成するデッキ名（slides/<name>.md の <name>）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2

      - name: Validate deck name
        env:
          DECK: ${{ inputs.deck }}
        run: |
          set -euo pipefail
          if [[ ! "$DECK" =~ ^[[:alnum:]_][[:alnum:]_.-]*$ ]] || [[ ! -f "slides/${DECK}.md" ]]; then
            echo "::error::Unknown or unsupported slide deck: ${DECK}"
            exit 1
          fi

      - name: Generate OGP image
        env:
          DECK: ${{ inputs.deck }}
        run: mise run ogp "${DECK}"

      - name: Upload generated OGP image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ogp-${{ inputs.deck }}
          path: dist/${{ inputs.deck }}/og-image.png
          if-no-files-found: error
          retention-days: 14
