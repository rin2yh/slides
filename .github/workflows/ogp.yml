name: Regenerate OGP

on:
  workflow_dispatch:
    inputs:
      deck:
        description: "OGP画像を再生成するスライド"
        required: true
        type: choice
        options:
          - pumlv-go
          - understanding-hid-through-tinygo

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2

      - name: Validate deck name
        env:
          DECK: ${{ inputs.deck }}
        run: |
          set -euo pipefail
          if [[ ! "$DECK" =~ ^[[:alnum:]_][[:alnum:]_.-]*$ ]] || [[ ! -f "slides/${DECK}.md" ]]; then
            echo "::error::Unknown or unsupported slide deck: ${DECK}"
            exit 1
          fi

      - name: Build site with selected OGP image
        uses: ./.github/actions/build-decks
        env:
          OGP_DECK: ${{ inputs.deck }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
