name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2

      - uses: ./.github/actions/build-decks

      # marp writes image paths into the HTML as-is and never checks them, so a
      # deck whose assets sit under the wrong name would deploy with broken
      # <img> tags. --offline skips the http(s) links in the decks and only
      # resolves the local ones, which also covers the hand-written index page.
      - name: Check the built site for broken images and links
        run: lychee --offline --no-progress dist
