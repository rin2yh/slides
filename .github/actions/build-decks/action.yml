name: Build decks
description: Build every Marp deck under slides/*.md into dist/<deck>, with its OGP image and its assets, plus the deck index page at dist/index.html. Assumes the marp CLI is already on PATH.

runs:
  using: composite
  steps:
    - name: Build all decks
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob

        OWNER="${GITHUB_REPOSITORY%/*}"
        REPO="${GITHUB_REPOSITORY#*/}"

        if [ -n "${OGP_DECK:-}" ] && [ ! -f "slides/${OGP_DECK}.md" ]; then
          echo "::error::Unknown slide deck: ${OGP_DECK}"
          exit 1
        fi

        for f in slides/*.md; do
          DECK="$(basename "$f" .md)"
          DECK_URL="https://${OWNER}.github.io/${REPO}/${DECK}/"
          echo "::group::build ${DECK}"

          # HTML
          marp --config-file .marprc.yml \
            "slides/${DECK}.md" \
            --html \
            --url "${DECK_URL}" \
            --og-image "${DECK_URL}og-image.png" \
            --output "dist/${DECK}/index.html"

          # Assets: shared/ plus this deck's own dir (either may be absent)
          mkdir -p "dist/${DECK}/public"
          cp -r slides/public/shared "dist/${DECK}/public/shared"
          if [ -d "slides/public/${DECK}" ]; then
            cp -r "slides/public/${DECK}" "dist/${DECK}/public/${DECK}"
          fi
          cp slides/public/shared/favicon.ico "dist/${DECK}/favicon.ico"

          # Regenerate all OGP images by default, or only the requested deck.
          if [ -z "${OGP_DECK:-}" ] || [ "$OGP_DECK" = "$DECK" ]; then
            marp --config-file .marprc.yml \
              "slides/${DECK}.md" \
              --image png \
              --allow-local-files \
              --output "dist/${DECK}/og-image.png"
          else
            if ! curl --fail --silent \
              "${DECK_URL}og-image.png" \
              --output "dist/${DECK}/og-image.png"; then
              echo "No deployed OGP found for ${DECK}; generating it."
              marp --config-file .marprc.yml \
                "slides/${DECK}.md" \
                --image png \
                --allow-local-files \
                --output "dist/${DECK}/og-image.png"
            fi
          fi

          echo "::endgroup::"
        done

    - name: Copy index page
      shell: bash
      run: |
        cp site/index.html dist/index.html
        cp slides/themes/dc.css dist/theme.css
        cp slides/public/shared/favicon.ico dist/favicon.ico
