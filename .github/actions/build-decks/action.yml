name: Build decks
description: Build every Marp deck under slides/*.md into dist/<deck>, with its OGP image and its assets, plus the deck index page at dist/index.html. Assumes the marp CLI is already on PATH.

runs:
  using: composite
  steps:
    - name: Build all decks
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob

        OWNER="${GITHUB_REPOSITORY%/*}"
        REPO="${GITHUB_REPOSITORY#*/}"

        for f in slides/*.md; do
          DECK="$(basename "$f" .md)"
          DECK_URL="https://${OWNER}.github.io/${REPO}/${DECK}/"
          echo "::group::build ${DECK}"

          # HTML
          marp --config-file .marprc.yml \
            "slides/${DECK}.md" \
            --html \
            --url "${DECK_URL}" \
            --og-image "${DECK_URL}og-image.png" \
            --output "dist/${DECK}/index.html"

          # Assets: shared/ plus this deck's own directory. A deck that uses
          # neither is fine; the check step below catches anything else.
          mkdir -p "dist/${DECK}/public"
          cp -r slides/public/shared "dist/${DECK}/public/shared"
          if [ -d "slides/public/${DECK}" ]; then
            cp -r "slides/public/${DECK}" "dist/${DECK}/public/${DECK}"
          fi
          cp slides/public/shared/favicon.ico "dist/${DECK}/favicon.ico"

          # OGP image (first slide)
          marp --config-file .marprc.yml \
            "slides/${DECK}.md" \
            --image png \
            --allow-local-files \
            --output "dist/${DECK}/og-image.png"

          echo "::endgroup::"
        done

    # marp writes image paths into the HTML as-is and never checks them, so a
    # deck whose assets sit under the wrong name would deploy with broken
    # <img> tags. Fail the build instead.
    - name: Check every referenced image was shipped
      shell: python
      run: |
        import pathlib
        import re
        import sys

        broken = []
        for html in sorted(pathlib.Path("dist").glob("*/index.html")):
            deck = html.parent
            for src in re.findall(r'src="\./([^"]+)"', html.read_text()):
                if not (deck / src).exists():
                    broken.append(f"{deck.name} references ./{src}, but dist/{deck.name}/{src} does not exist")

        for problem in broken:
            print(f"::error::{problem}")
        sys.exit(1 if broken else 0)

    - name: Copy index page
      shell: bash
      run: |
        cp site/index.html dist/index.html
        cp slides/theme.css dist/theme.css
        cp slides/public/shared/favicon.ico dist/favicon.ico
