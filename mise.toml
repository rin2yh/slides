[tools]
# marp-cli スタンドアロンバイナリを aqua 経由で取得（Node 非依存）。
# PDF / PNG 出力には別途システムのブラウザ（Chrome/Chromium 等）が必要。
"aqua:marp-team/marp-cli" = "4.5.0"

[tasks.dev]
description = "開発サーバを起動（ライブリロード）: mise run dev"
run = "marp --config-file .marprc.yml --server slides"

[tasks.build]
description = "slides/ を dist/ にHTMLビルド: mise run build"
run = "marp --config-file .marprc.yml"

[tasks.index]
description = "デッキ一覧ページを dist/index.html に生成: mise run index"
# site/index.html の @DECKS@ を、各デッキの frontmatter から作った <li> に差し替える。
# 拾うのは title と date の 2 行だけ。並びは date の新しい順（date 無しは末尾）。
run = '''
list=$(
  for f in slides/*.md; do
    deck="$(basename "$f" .md)"
    title="$(sed -n 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/^title: *//p' "$f" | head -1)"
    date="$(sed -n 's/^date: *//p' "$f" | head -1)"
    time=""
    [ -z "$date" ] || time="<time datetime=\"$date\">$date</time>"
    echo "${date:-0000-00-00}|      <li><a href=\"./$deck/\">${title:-$deck}</a>$time</li>"
  done | sort -t"|" -k1,1r -k2,2 | cut -d"|" -f2-
)
mkdir -p dist
awk -v list="$list" '/@DECKS@/ { print list; next } { print }' site/index.html > dist/index.html
cp slides/public/favicon.ico dist/favicon.ico
echo "generated: dist/index.html"
'''

[tasks.export]
description = "PDF出力: mise run export -- slides/<name>.md --output dist/<name>.pdf"
run = "marp --config-file .marprc.yml --pdf --allow-local-files"

[tasks.new]
description = "テンプレートから新規スライドを作成: mise run new <name>"
run = '''
name="{{arg(name='name')}}"
dest="slides/${name}.md"
if [ -e "$dest" ]; then
  echo "already exists: $dest" >&2
  exit 1
fi
cp slides/templates/template.md "$dest"
echo "created: $dest"
echo "next: mise run dev  →  http://localhost:8080/${name}"
'''
