<!DOCTYPE html>
<!--
  サイトトップ（デッキ一覧）。デッキを足したら <li> を 1 行足す。日付の新しい順
-->
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>slides</title>
    <meta name="description" content="Rinrin の発表スライド一覧。" />
    <link rel="icon" href="./favicon.ico" />
    <!-- スライドと同じ theme.css。当たるのは :root のトークンとフォントだけで、
         レイアウト系のルールは全部 section 配下なのでこのページには効かない -->
    <link rel="stylesheet" href="./theme.css" />
    <style>
      body {
        max-width: 40rem;
        margin: 0 auto;
        padding: 3rem 1.25rem;
        font-family: var(--dc-font-sans);
        line-height: 1.7;
        background: var(--dc-bg);
        color: var(--dc-text);
      }
      a { color: var(--dc-accent); }
      a:hover { color: var(--dc-accent-hover); }
      h1 { font-size: 1.75rem; }
      ul { list-style: none; padding: 0; }
      li { margin-bottom: 1.25rem; }
      li a { font-size: 1.1rem; font-weight: 700; }
      time { display: block; font-size: 0.85rem; color: var(--dc-muted); }
    </style>
  </head>
  <body>
    <h1>slides</h1>
    <p>Rinrin の発表スライド一覧</p>
    <ul>
      <li><a href="./go-coverage/">なぜGoのカバレッジはstmtとfnなのか</a><time datetime="2026-07-03">2026-07-03</time></li>
    </ul>
  </body>
</html>
